# Fork-only workflow: cross-compiles nerva and uploads the binaries as
# downloadable GitHub Actions artifacts.
#
# Upstream (praetorian-inc/nerva) publishes releases through its own pinned
# GoReleaser pipeline and has no need for this. Drop this file from any pull
# request sent upstream.
#
# All targets build on ubuntu-latest via cross-compilation rather than on
# macOS/Windows runners: the binary is pure Go (CGO_ENABLED=0), and on private
# repositories runner minutes are billed at Linux x1, Windows x2, macOS x10.
name: Build Artifact

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          out=nerva
          if [ "$GOOS" = windows ]; then out=nerva.exe; fi
          go build -trimpath -ldflags '-s -w' -o "dist/$out" ./cmd/nerva
          ls -lh "dist/$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nerva-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          # Bounded because artifact storage is capped at 500 MB on private
          # repos (it is unmetered on public ones). Raise or drop as needed.
          retention-days: 14
          if-no-files-found: error
