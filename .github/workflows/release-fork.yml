# Fork-only release workflow: on a `v*` tag, cross-compiles nerva and publishes
# the archives as a GitHub Release, which appears on the repository landing page
# with permanent, public download links.
#
# This exists because the upstream release.yml cannot run on a fork: it drives
# GoReleaser against a .goreleaser.yaml hardcoded to `owner: praetorian-inc` and
# requires org-level secrets and a `release` environment. This workflow instead
# uses only the automatic GITHUB_TOKEN.
#
# Drop this file from any pull request sent upstream.
#
# Usage:
#   git tag v0.1.0-protocol-only
#   git push origin v0.1.0-protocol-only
#
# Tags containing a hyphen (e.g. v0.1.0-rc1) are published as prereleases,
# matching the upstream `prerelease: auto` convention.
name: Release (fork)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin=nerva
            [ "$os" = windows ] && bin=nerva.exe

            work="build/${os}_${arch}"
            mkdir -p "$work"

            # No -X version stamping: cmd/nerva declares no version variables,
            # so the linker would silently discard the flags.
            GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags '-s -w' -o "$work/$bin" ./cmd/nerva
            cp README.md LICENSE "$work/"

            name="nerva_${version}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$work" && zip -qr "${GITHUB_WORKSPACE}/dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$work" .
            fi
          done

          (cd dist && sha256sum nerva_* > checksums.txt)
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "nerva $GITHUB_REF_NAME" \
            --notes "Fork build of nerva from \`$GITHUB_REF_NAME\` (\`${GITHUB_SHA:0:7}\`).

          Binaries for linux, darwin and windows on amd64/arm64. Verify with \`checksums.txt\`:

          \`\`\`sh
          sha256sum -c checksums.txt --ignore-missing
          \`\`\`

          Unofficial build — not published by Praetorian." \
            "${prerelease[@]}"
